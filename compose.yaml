include:
  - path: compose.themes.yaml
  - path: compose.decks.yaml

services:
  traefik:
    image: traefik:v3.7@sha256:f86a2cab1b5c649070c49f883c743dd32d8485a56e3368c5f93b9e91f1e91259
    ports:
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./.docker/traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./.docker/traefik/dynamic.yaml:/etc/traefik/dynamic.yaml:ro
      - ./.docker/traefik/certs:/etc/traefik/certs:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.slides.localhost`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.tls=true"

  dev:
    build: .
    profiles:
      - dev
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: >
      sh -c "pnpm install && sleep infinity"

  export:
    build:
      context: .
      target: export
    profiles:
      - export
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - playwright_browsers:/root/.cache/ms-playwright
    entrypoint:
      - sh
      - -c
      - pnpm install && pnpm exec playwright install chromium && cd "$1" && pnpm export
      - sh

volumes:
  node_modules:
  playwright_browsers:
